# config.yaml

app:
  name: "Dataset Builder"
  subtitle: "Review and refine AI training data from your documents"
  persona: "climate change expert AI assistant"
  audience: "farmers, fishermen, coastal communities, or general public"

server:
  host: "0.0.0.0"
  port: 8501
  reload: true

llama_server:
  url: "http://REPLACE_ME_LAN_IP"
  timeout: 800
  max_tokens: 20000
  temperature: 0.6
  top_p: 0.95
  name: "llm" # model alias name inside llama.cpp router configuration

paths:
  pdf_dir: "pdf"
  web_dir: "web"
  result_dir: "result"
  state_file: ".review_state.json"

processing:
  qa_per_10k_tokens: 35     # target Q&As per 10K tokens, scales linearly
  qa_min: 3                 # floor: avoid degenerate single-Q&A chunks
  qa_max: 60                # ceiling: avoid context overflow on huge chunks
  batch_delay: 8.0          # seconds between chunks requests
  image_qa_per_image: 3     # Q&A per image
  enable_multimodal: true
  semantic_chunking: true   # toggle: if false, treat entire doc as one chunk
  semantic_batch_size: 60
  semantic_overlap: 10
  max_chunk_tokens: 10000   # if too high-> lost-in-the-middle effect (LITM)
  force_doc_type: ""        # leave empty for auto
  max_retries: 3            # number of retries after request failure
  retry_delay: 8            # seconds of delay after request failure
  debug_print: false
